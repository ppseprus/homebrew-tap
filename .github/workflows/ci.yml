name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monthly, so a formula that rots against a newer Homebrew is noticed
  # before someone tries to install it.
  schedule:
    - cron: '0 6 1 * *'

jobs:
  formula:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5

      # Both runner images ship Homebrew already
      - name: Put brew on PATH
        run: |
          if ! command -v brew > /dev/null; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi
          brew --version

      - name: Install this checkout as a tap
        run: |
          taps="$(brew --repository)/Library/Taps/ppseprus"
          mkdir -p "$taps"
          ln -s "$GITHUB_WORKSPACE" "$taps/homebrew-tap"
          brew tap

      - name: Style
        run: brew style ppseprus/tap

      # --online fetches the tarball and checks the URL and checksum, so this
      # fails if the tag is missing or the sha256 is stale.
      - name: Audit
        run: brew audit --strict --online ppseprus/tap/git-exclude

      - name: Install from source
        run: brew install --build-from-source ppseprus/tap/git-exclude

      - name: Test
        run: brew test ppseprus/tap/git-exclude

      - name: The man page is installed and git dispatches to it
        run: |
          git exclude --version
          man -w git-exclude
